name: App Store

# Uploads texts, review notes and fresh screenshots to App Store Connect.
# With "submit" it also attaches a TestFlight build and submits version 1.x for review;
# an approved version still waits for a manual release in App Store Connect.
on:
  workflow_dispatch:
    inputs:
      submit:
        description: Submit for review (type "einreichen" to confirm)
        required: false
        default: ""
      build_number:
        description: TestFlight build number (empty = latest processed build)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: app-store
  cancel-in-progress: false

jobs:
  screenshots:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/screenshots.yml

  upload:
    needs: screenshots
    # secrets must only reach main
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: screenshots-*
          path: ${{ runner.temp }}/screenshots
      - name: Arrange screenshots for deliver
        run: |
          # The UI is German only, so every listing shows the same screenshots.
          for locale in de-DE en-US; do
            mkdir -p "fastlane/screenshots/$locale"
            for dir in "$RUNNER_TEMP"/screenshots/screenshots-*; do
              device="${dir##*/screenshots-}"
              for png in "$dir"/*.png; do
                cp "$png" "fastlane/screenshots/$locale/$device-$(basename "$png")"
              done
            done
          done
          find fastlane/screenshots -name '*.png' | sort
      - name: Write App Store Connect key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc_key.p8"
          chmod 600 "$RUNNER_TEMP/asc_key.p8"
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          REVIEW_FIRST_NAME: ${{ vars.REVIEW_FIRST_NAME }}
          REVIEW_LAST_NAME: ${{ vars.REVIEW_LAST_NAME }}
          REVIEW_EMAIL: ${{ vars.REVIEW_EMAIL }}
          REVIEW_PHONE: ${{ secrets.REVIEW_PHONE }}
          SUBMIT: ${{ inputs.submit }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/asc_key.p8"
          if [ "$SUBMIT" = einreichen ]; then
            if [ -n "$BUILD_NUMBER" ]; then
              fastlane submit build_number:"$BUILD_NUMBER"
            else
              fastlane submit
            fi
          else
            [ -z "$SUBMIT" ] || echo "submit is \"$SUBMIT\", not \"einreichen\": uploading without submitting" >&2
            fastlane metadata
          fi
      - name: Remove App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_key.p8"
