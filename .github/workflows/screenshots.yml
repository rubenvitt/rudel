name: Screenshots

# App Store screenshots in the sizes App Store Connect asks for (6.9" iPhone, 13" iPad).
# Start by hand for a look; the App Store workflow calls it and uploads the PNGs.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone-6.9
            pattern: '^iPhone [0-9]+ Pro Max$'
          - name: iPad-13
            pattern: '^iPad Pro 13-inch'
    name: screenshots (${{ matrix.name }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/xcodegen
      - name: Boot simulator with a clean status bar
        env:
          PATTERN: ${{ matrix.pattern }}
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r --arg p "$PATTERN" '[.devices[][] | select(.name | test($p))] | last | .udid')
          if [ -z "$UDID" ] || [ "$UDID" = null ]; then
            echo "No simulator matches $PATTERN" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
      - name: Take screenshots
        env:
          TEST_RUNNER_SCREENSHOTS: "1"
        run: |
          xcodebuild test -scheme Rudel -destination "id=$UDID" \
            -only-testing:RudelUITests/AppStoreScreenshots/testAppStoreScreenshots \
            -resultBundlePath "$RUNNER_TEMP/screenshots.xcresult" CODE_SIGNING_ALLOWED=NO
      - name: Export PNGs
        run: |
          OUT="$RUNNER_TEMP/screenshots"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/screenshots.xcresult" --output-path "$OUT"
          cd "$OUT"
          jq -r '.[].attachments[] | [.exportedFileName, .suggestedHumanReadableName] | @tsv' manifest.json |
            while IFS=$'\t' read -r file name; do mv "$file" "$name"; done
          ls -la
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots-${{ matrix.name }}
          path: ${{ runner.temp }}/screenshots/*.png
          if-no-files-found: error
