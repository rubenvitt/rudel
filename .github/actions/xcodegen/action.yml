name: XcodeGen
description: Installs a pinned, checksum-verified XcodeGen release and generates Rudel.xcodeproj.

# Pinned instead of `brew install xcodegen`, so a new release (or a tampered bottle) never reaches the jobs that hold
# the App Store Connect key. To update: change VERSION and SHA256 (shasum -a 256 of the release's xcodegen.zip).
runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: 2.46.0
        SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
      run: |
        ZIP="$RUNNER_TEMP/xcodegen.zip"
        curl -sSLf -o "$ZIP" "https://github.com/yonaskolb/XcodeGen/releases/download/$VERSION/xcodegen.zip"
        echo "$SHA256  $ZIP" | shasum -a 256 -c -
        unzip -q -o "$ZIP" -d "$RUNNER_TEMP"
        "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
