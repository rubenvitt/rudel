name: Rudel

options:
  bundleIdPrefix: email.rubeen
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  RudelEngine:
    path: Packages/RudelEngine

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Rudel:
    type: application
    platform: iOS
    # Folder glob: neue Dateien landen automatisch im Target,
    # niemand muss project.yml anfassen.
    sources:
      - path: Rudel
    dependencies:
      - package: RudelEngine
        product: RudelEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: email.rubeen.Rudel
        PRODUCT_NAME: Rudel
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rudel
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Simulator-Builds brauchen kein Team; leer lassen bis ein Device-Build ansteht.
        DEVELOPMENT_TEAM: ""

  RudelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/RudelTests
    dependencies:
      - target: Rudel
      - package: RudelEngine
        product: RudelEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: email.rubeen.RudelTests
        GENERATE_INFOPLIST_FILE: YES

  # Smoke-Test, der die Screens tatsächlich ausführt. Der Compiler prüft nur,
  # ob SwiftUI-Code übersetzt — er fängt keinen Force-Unwrap und kein
  # #Predicate, das erst zur Laufzeit crasht. Genau diese Klasse Fehler ist bei
  # generiertem UI-Code die wahrscheinlichste.
  RudelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/RudelUITests
    dependencies:
      - target: Rudel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: email.rubeen.RudelUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Rudel:
    build:
      targets:
        Rudel: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - RudelTests
        - RudelUITests
